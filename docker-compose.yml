# Production image only. Use the central deploy.py for health-gated traffic switching.
services:
  app:
    image: ${APP_IMAGE:?set an immutable registry image@sha256 digest}
    init: true
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-.env.production}
        required: false
        format: raw
    environment:
      NODE_ENV: production
      PORT: 3004
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: "--max-old-space-size=${APP_HEAP_MB:-160}"
      INTERNAL_API_URL: ${INTERNAL_API_URL:-https://api.inhayat.com/api/v1}
    expose:
      - "3004"
    networks:
      edge:
        aliases:
          - inhayat-marketer-web-${DEPLOY_SLOT:-manual}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    cpus: ${APP_CPU_LIMIT:-0.5}
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  edge:
    external: true
    name: inhayat-edge
